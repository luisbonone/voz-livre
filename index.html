<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f9e92"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Voz Livre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one-column app shell (max 560px), card-light; header with mode switch; each lesson is its own screen */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1d2b4f; --muted:#5d6b8a; --line:#dde3ef;
  --accent:#1f9e92; --accent-ink:#ffffff; --sun:#ffc23c; --coral:#f2604f; --ok:#22a061; --band:rgba(31,158,146,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a2e; --surface:#1b2540; --ink:#eef2fb; --muted:#a3afc9; --line:#2c3858;
  --accent:#3cc5b7; --accent-ink:#0e1a2c; --sun:#ffcf5c; --coral:#ff7d6e; --ok:#3fc985; --band:rgba(60,197,183,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a2e; --surface:#1b2540; --ink:#eef2fb; --muted:#a3afc9; --line:#2c3858;
  --accent:#3cc5b7; --accent-ink:#0e1a2c; --sun:#ffcf5c; --coral:#ff7d6e; --ok:#3fc985; --band:rgba(60,197,183,.18); color-scheme:dark}
body.kid{--accent:#f2604f; --band:rgba(242,96,79,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.kid{--accent:#ff7d6e;--band:rgba(255,125,110,.18)}}
:root[data-theme="dark"] body.kid{--accent:#ff7d6e;--band:rgba(255,125,110,.18)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.45rem,5.5vw,2rem);font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,.lesson:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:24px;height:24px;fill:var(--accent-ink)}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:800}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:center}
.hero .mascot{flex:none;width:76px;height:76px}
.hero div{min-width:0;display:flex;flex-direction:column;gap:6px}
.stars{font-weight:700;color:var(--muted);font-size:.95rem}
.stars span{color:var(--sun)}

.voicepick{display:flex;flex-direction:column;gap:8px}
.voicepick .seg{align-self:flex-start;flex-wrap:wrap}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.lesson:hover{border-color:var(--accent)}
.lesson .num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--band);color:var(--accent)}
.lesson .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.lesson .txt small{color:var(--muted)}
.lesson .done{flex:none;font-size:1.3rem;color:var(--sun)}

.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--band);border-radius:14px;padding:12px 14px;font-size:.95rem}
.tip b{color:var(--accent)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* breathing */
.breath{display:grid;place-items:center;height:260px;position:relative}
.ball{width:110px;height:110px;border-radius:50%;background:var(--accent);opacity:.9;transform:scale(.7);transition:transform 4s ease-in-out}
.breath .say{position:absolute;inset:auto 0 0 0;text-align:center;font-family:var(--display);font-size:1.5rem;font-weight:800}
.breath .count{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--accent-ink)}

/* warmup */
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line)}
.steps li.on{border-color:var(--accent);background:var(--band)}
.steps li.ok .n{background:var(--ok);color:#fff}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line);color:var(--ink)}
.steps .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

/* pitch */
.target{display:flex;align-items:baseline;justify-content:center;gap:10px}
.target .note{font-family:var(--display);font-size:3.2rem;font-weight:800;color:var(--accent)}
.target small{color:var(--muted);font-weight:700}
canvas{width:100%;height:220px;display:block;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.meter{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--sun) 35%,var(--ok) 45%,var(--ok) 55%,var(--sun) 65%,var(--coral))}
.meter i{position:absolute;top:-6px;width:6px;height:28px;border-radius:4px;background:var(--ink);left:50%;transform:translateX(-50%);transition:left .12s linear}
.meterlab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700}
.hint{font-family:var(--display);font-size:1.4rem;font-weight:800;text-align:center;min-height:2.2em}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.notes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.notes button{border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 12px;font-weight:800}
.notes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.demo{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.demo input{width:100%}
.win{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.win .big{font-size:3rem;line-height:1;color:var(--sun)}
footer{font-size:.85rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.ball,.meter i,.progress b{transition:none}}
/* ---- trail map ---- */
.statrow{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:700;font-size:.8rem}
.verse{font-style:italic;color:var(--muted);font-size:.95rem;text-align:center}
.unit{display:flex;flex-direction:column;gap:10px}
.unit h3{display:flex;align-items:center;gap:8px}
.unit h3 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:700}
.path{display:flex;flex-direction:column;gap:6px;position:relative}
.node{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:0;padding:6px 4px;border-radius:14px}
.node:nth-child(4n+2){padding-left:28px}.node:nth-child(4n+3){padding-left:56px}.node:nth-child(4n){padding-left:28px}
.node .dot{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--surface);border:3px solid var(--line);color:var(--muted)}
.node.open .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 4px 0 var(--band)}
.node.next .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.node.done .dot{background:var(--sun);border-color:var(--sun);color:#1d2b4f}
.node.locked{cursor:default}
.node.locked .dot{opacity:.6}
.node .txt{min-width:0;display:flex;flex-direction:column}
.node .txt b{font-family:var(--display);font-size:1.08rem;font-weight:600;line-height:1.2}
.node .txt small{color:var(--muted)}
.node.locked .txt{opacity:.6}
.node:not(.locked):hover .dot{transform:translateY(-1px)}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:4px}
/* ---- sequence ---- */
.seqdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seqdots span{min-width:38px;padding:4px 8px;border-radius:10px;border:2px solid var(--line);text-align:center;font-weight:800;font-size:.9rem}
.seqdots span.cur{border-color:var(--accent);color:var(--accent);background:var(--band)}
.seqdots span.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.credit{font-size:.82rem;color:var(--muted);text-align:center}
.bigtime{font-family:var(--display);font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.vol{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{color:var(--muted);font-weight:700}
.holdinfo{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
canvas.lane{height:260px}
.vcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.vcard div{min-width:0;display:flex;flex-direction:column}
.vcard b{font-family:var(--display);font-size:1.3rem;line-height:1.15}
.vcard small{color:var(--muted)}
.vcard.new{border:2px dashed var(--accent)}
canvas.keys{height:90px}
.vtsteps{display:flex;gap:6px;justify-content:center}
.vtsteps span{width:34px;height:6px;border-radius:3px;background:var(--line)}
.vtsteps span.on{background:var(--accent)}.vtsteps span.ok{background:var(--ok)}
.live{text-align:center;font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.result b{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--accent)}
.lyric{text-align:center;font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.5}
.lyric span{color:var(--muted);transition:color .1s}
.lyric span.now{color:var(--accent);font-weight:800}
.lyric span.past{color:var(--ink)}
body.wide .app{max-width:1040px}
.level{display:flex;flex-direction:column;gap:14px}
.levelhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.levelhead .lv{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.levelhead div{min-width:0;display:flex;flex-direction:column}
.levelhead b{font-family:var(--display);font-size:1.25rem;line-height:1.15}
.levelhead small{opacity:.9;font-weight:700}
.levelhead.locked{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.levelhead.locked .lv{background:var(--line)}
.soon{display:flex;flex-direction:column;gap:10px}
.soon ul{margin:0;padding-left:1.2em;color:var(--muted);font-size:.93rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 10px;font-weight:800;font-size:1rem}
.choices button:hover:not(:disabled){border-color:var(--accent)}
.choices button.right{border-color:var(--ok);background:rgba(34,160,97,.15);color:var(--ok)}
.choices button.wrong{border-color:var(--coral);background:rgba(242,96,79,.12);color:var(--coral)}
.qcount{text-align:center;font-weight:800;color:var(--muted)}
.slide{display:flex;flex-direction:column;gap:10px;min-height:9em}
.slide h3{font-size:1.3rem}
.slide p{font-size:1.05rem;line-height:1.6}
.slidedots{display:flex;gap:6px;justify-content:center}
.slidedots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.slidedots span.on{background:var(--accent)}
.reqs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.reqs li{display:flex;gap:8px;align-items:center}
.daily{border:2px solid var(--accent)}
.acct{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.form input[type=text],.form input[type=email],.form input[type=password],textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.form input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.check{flex-direction:row!important;align-items:flex-start;gap:10px!important;font-weight:600!important}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.err{color:var(--coral);font-weight:700;min-height:1.2em}
.okmsg{color:var(--ok);font-weight:700}
.tabs{display:flex;gap:6px}
.msgcard{background:var(--surface);border:2px solid var(--sun);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msgcard p{font-weight:700}
.msglist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.msglist li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.msglist small{color:var(--muted);display:block}
.classchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.classchips button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
.classchips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.12em;color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.students{border-collapse:collapse;width:100%;min-width:720px;font-size:.95rem}
table.students th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
table.students td{padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
table.students tr:last-child td{border-bottom:0}
table.students tbody tr{cursor:pointer}
table.students tbody tr:hover,table.students tbody tr.sel{background:var(--band)}
.minibar{width:90px;height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.minibar b{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.8rem;white-space:nowrap}
.chip.ok{background:rgba(34,160,97,.15);color:var(--ok)}
.chip.warn{background:rgba(255,194,60,.25);color:#9a6b00}
.chip.bad{background:rgba(242,96,79,.15);color:var(--coral)}
.chip.idle{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.warn{color:var(--sun)}}
:root[data-theme="dark"] .chip.warn{color:var(--sun)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail>div{min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.lessonlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.lessonlist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.lessonlist li span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.dynband{position:relative;height:120px;border-radius:14px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.dynband .zone{position:absolute;left:0;right:0;background:var(--band);border-block:2px dashed var(--accent)}
.dynband .lvl{position:absolute;left:0;bottom:0;height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center}
.dynband .lvl i{display:block;width:40%;background:var(--accent);border-radius:10px 10px 0 0;transition:height .08s}
.vol b{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
/* ---- guide character (kids) ---- */
.guide{display:flex;gap:12px;align-items:flex-end}
.guide .davi{flex:none;width:84px;height:84px;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--accent);border-radius:18px 18px 18px 6px;padding:12px 14px;font-weight:700;font-size:1rem}
.bubble small{display:block;font-family:var(--display);color:var(--accent);font-size:.9rem;line-height:1.1;margin-bottom:2px}
.bubble .spk{position:absolute;top:6px;right:8px;border:0;background:transparent;font-size:1rem;padding:2px}
.bubble p{padding-right:22px}
.davi .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.davi.talk .beak-low{animation:talk .22s ease-in-out infinite alternate;transform-origin:top;transform-box:fill-box}
.davi.happy .wing{animation:flap .35s ease-in-out infinite alternate;transform-origin:top right;transform-box:fill-box}
.davi.cheer{animation:hop .5s ease-in-out infinite}
.davi.cheer .wing{animation:flap .2s ease-in-out infinite alternate;transform-origin:top right;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{50%{transform:translateY(-12px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes flap{to{transform:rotate(-28deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion: reduce){.guide .davi,.davi *,.davi.cheer{animation:none!important}.confetti{display:none}}
</style>

<div class="app" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=(s,el=document)=>el.querySelector(s);
const store={

/* ---------- music helpers ---------- */
const NAMES=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const nm=m=>NAMES[((m%12)+12)%12];
const midiToHz=m=>440*Math.pow(2,(m-69)/12);
const hzToMidi=f=>69+12*Math.log2(f/440);
const nmo=m=>nm(m)+(Math.floor(Math.round(m)/12)-1);
function baseNote(lesson){
  if(state.vt) return state.vt.base;
  if(K()) return lesson&&lesson.kidBase!=null?lesson.kidBase:60;
  return state.voice==='low'?48:57;
}

let actx=null;
function ctx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function playTone(hz,dur=1.4,glideTo=null,when=0){
  const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;
  o.type='triangle';o.frequency.setValueAtTime(hz,t);
  if(glideTo){o.frequency.exponentialRampToValueAtTime(glideTo,t+dur/2);o.frequency.exponentialRampToValueAtTime(hz,t+dur);}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.04);g.gain.setValueAtTime(.25,t+Math.max(.05,dur-.12));g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
let mic=null;
async function startMic(){
  if(mic)return true;
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ctx(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=2048;src.connect(an);
    mic={analyser:an,buf:new Float32Array(an.fftSize),stream};return true;}catch(e){return false;}
}
function stopMic(){if(mic){mic.stream.getTracks().forEach(t=>t.stop());mic=null;}}
function rmsOf(buf){let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];return Math.sqrt(r/buf.length);}
function detectPitch(buf,sr){
  if(rmsOf(buf)<0.012)return null;
  let r1=0,r2=buf.length-1;const th=0.2;
  for(let i=0;i<buf.length/2;i++)if(Math.abs(buf[i])<th){r1=i;break;}
  for(let i=1;i<buf.length/2;i++)if(Math.abs(buf[buf.length-i])<th){r2=buf.length-i;break;}
  const b=buf.slice(r1,r2),n=b.length,c=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<n-i;j++)s+=b[j]*b[j+i];c[i]=s;}
  let d=0;while(d<n-1&&c[d]>c[d+1])d++;
  let mv=-1,mp=-1;for(let i=d;i<n;i++)if(c[i]>mv){mv=c[i];mp=i;}
  if(mp<=0||mp>=n-1)return null;
  const x1=c[mp-1],x2=c[mp],x3=c[mp+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  const f=sr/(a?mp-bb/(2*a):mp);return(f>70&&f<1100)?f:null;
}

const prof={classes:[],sel:null,students:[],prog:{},msgs:[],detail:null,loaded:false};
function relDay(iso){if(!iso)return 'nunca';const d=Math.floor((Date.now()-new Date(iso).getTime())/864e5);return d<=0?'hoje':d===1?'ontem':`há ${d} dias`;}
function studentInfo(st){
  const pr=prof.prog[st.id]||{},done=Object.keys(pr.done||{}).filter(k=>pr.done[k]&&idx(k)>=0).length,sc=Object.values(pr.scores||{});
  const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
  const days=pr.updated_at?Math.floor((Date.now()-new Date(pr.updated_at).getTime())/864e5):null;
  const sk=pr.streak||{};let streak=0;if(sk.last){const ds=Math.floor((Date.now()-new Date(sk.last+'T12:00:00').getTime())/864e5);streak=ds<=1?(sk.n||0):0;}
  let status,cls,rank;
  if(done===0&&(days==null||days>=3)){status='Ainda não começou';cls='idle';rank=2;}
  else if(days!=null&&days>=5){status='Sumido';cls='bad';rank=0;}
  else if(avg!=null&&avg<60){status='Precisa de ajuda';cls='warn';rank=1;}
  else{status='Em dia';cls='ok';rank=3;}
  return {pr,done,avg,days,streak,status,cls,rank,last:pr.updated_at};}
async function profLoadClasses(){
  const r=await cloud.sb.from('classes').select('*').eq('teacher_id',cloud.user.id).order('created_at');prof.classes=r.data||[];
  if(!prof.sel&&prof.classes.length)prof.sel=prof.classes[0].id;}
async function profLoadStudents(){
  prof.students=[];prof.prog={};prof.msgs=[];if(!prof.sel)return;
  const s=await cloud.sb.from('profiles').select('id,full_name,email,is_minor,guardian_name,created_at').eq('class_id',prof.sel).eq('role','student').order('full_name');
  prof.students=s.data||[];const ids=prof.students.map(x=>x.id);if(!ids.length)return;
  const [pr,ms]=await Promise.all([cloud.sb.from('progress').select('*').in('user_id',ids),
    cloud.sb.from('messages').select('*').eq('teacher_id',cloud.user.id).in('student_id',ids).order('created_at',{ascending:false})]);
  (pr.data||[]).forEach(x=>prof.prog[x.user_id]=x);prof.msgs=ms.data||[];}
function viewTeacher(el){
  if(!cloudOn()||!cloud.user){el.innerHTML=`<div class="panel"><p>Entre com a sua conta de professor.</p><button class="btn" id="lg">Entrar</button></div>`;$('#lg').onclick=()=>go('conta');return;}

    (async()=>{try{await profLoadClasses();await profLoadStudents();prof.loaded=true;}catch(e){prof.loaded=true;}if(state.view==='prof')viewTeacher(el);})();return;}
  const c=prof.classes.find(x=>x.id===prof.sel);
  const rows=prof.students.map(st=>({st,...studentInfo(st)})).sort((a,b)=>a.rank-b.rank||(a.st.full_name||'').localeCompare(b.st.full_name||''));
  const active=rows.filter(r=>r.days!=null&&r.days<7).length,attention=rows.filter(r=>r.rank<=1).length;
  el.innerHTML=`<div class="classchips">${prof.classes.map(x=>`<button data-c="${x.id}" aria-pressed="${x.id===prof.sel}">${esc(x.name)}</button>`).join('')}

    ${!c?`<div class="panel"><h3>Crie a sua primeira turma</h3><p class="muted">Dê um nome (por exemplo "Coral Kids" ou "Ministério de louvor") e o app gera um código para os alunos entrarem.</p></div>`:`
    <div class="panel">
      <div class="codebox"><div><span class="label">Código da turma ${esc(c.name)}</span><div class="code" id="ccode">${esc(c.code)}</div></div>
        <button class="btn ghost" id="copy">Copiar código</button><button class="btn ghost" id="reload">↻ Atualizar</button></div>
      <p class="muted">Os alunos tocam em <b>Entrar</b> no app, criam a conta e digitam este código.</p>
      <div class="statrow"><div class="stat"><b>${rows.length}</b><small>alunos</small></div><div class="stat"><b>${active}</b><small>treinaram nesta semana</small></div><div class="stat"><b>${attention}</b><small>precisam de atenção</small></div></div>
    </div>
    ${rows.length?`<div class="tablewrap"><table class="students"><thead><tr><th>Aluno</th><th>Situação</th><th>Nível</th><th>Progresso</th><th>Nota média</th><th>Sequência</th><th>Último acesso</th><th>Voz</th></tr></thead><tbody>
      ${rows.map(r=>`<tr data-s="${r.st.id}" class="${prof.detail===r.st.id?'sel':''}"><td><b>${esc(r.st.full_name||r.st.email)}</b>${r.st.is_minor?' <small class="muted">(menor)</small>':''}</td>

        <td>${r.avg==null?'–':r.avg}</td><td>${r.streak?`🔥 ${r.streak}`:'–'}</td><td>${relDay(r.last)}</td><td>${r.pr.vt?esc(r.pr.vt.cls):'–'}</td></tr>`).join('')}
    </tbody></table></div>`:`<div class="panel"><p class="muted">Nenhum aluno nesta turma ainda. Passe o código <b>${esc(c.code)}</b> para eles.</p></div>`}
    <div id="det"></div>`}`;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{prof.sel=b.dataset.c;prof.detail=null;prof.loaded=false;viewTeacher(el);await profLoadStudents();prof.loaded=true;viewTeacher(el);});
  $('#ncf').onsubmit=async e=>{e.preventDefault();const n=$('#ncn').value.trim();if(!n)return;
    const r=await cloud.sb.rpc('create_class',{class_name:n});if(r.error){$('#ncn').value='';$('#ncn').placeholder=PT_ERR(r.error.message);return;}
    const row=Array.isArray(r.data)?r.data[0]:r.data;prof.sel=row&&row.id;await profLoadClasses();await profLoadStudents();viewTeacher(el);};
  const cp=$('#copy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(c.code);cp.textContent='Copiado!';}catch(e){const r=document.createRange();r.selectNodeContents($('#ccode'));const s2=getSelection();s2.removeAllRanges();s2.addRange(r);cp.textContent='Selecionado';}};
  const rl=$('#reload');if(rl)rl.onclick=async()=>{rl.disabled=true;await profLoadStudents();viewTeacher(el);};
  el.querySelectorAll('tr[data-s]').forEach(tr=>tr.onclick=()=>{prof.detail=tr.dataset.s;viewTeacher(el);const d=$('#det');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});});
  if(prof.detail){const r=rows.find(x=>x.st.id===prof.detail);if(r)drawDetail($('#det'),r);}
}
function drawDetail(el,r){
  const st=r.st,pr=r.pr,sc=pr.scores||{},dn=pr.done||{},msgs=prof.msgs.filter(m=>m.student_id===st.id);

  el.innerHTML=`<div class="panel"><div><span class="label">Aluno</span><h3>${esc(st.full_name||st.email)}</h3>
      <p class="muted">${esc(st.email)}${st.is_minor?` · Menor de idade, responsável: ${esc(st.guardian_name||'–')}`:''} · na turma desde ${new Date(st.created_at).toLocaleDateString('pt-BR')}</p></div>

    <div class="detail"><div><span class="label">Aulas</span><ul class="lessonlist">${L.map((l,k)=>`<li><span>${k+1}. ${esc(l.title.adult)}</span><span>${dn[l.id]?'✓':''}${sc[l.id]!=null?` ${sc[l.id]}`:''}</span></li>`).join('')}</ul>
      ${pr.vt?`<p><b>Voz:</b> ${esc(pr.vt.cls)}, de ${nmo(pr.vt.low)} até ${nmo(pr.vt.high)}</p>`:''}${pr.last_lesson&&idx(pr.last_lesson)>=0?`<p><b>Última aula aberta:</b> ${esc(L[idx(pr.last_lesson)].title.adult)}</p>`:''}</div>
    <div><span class="label">Recados</span>
      <form class="form" id="mf"><textarea id="mb" rows="3" maxlength="1000" placeholder="Ex.: Muito bem na escala! Esta semana repita a aula Nota longa afinada."></textarea><p class="err" id="merr"></p><button class="btn" type="submit">Enviar recado</button></form>
      ${msgs.length?`<ul class="msglist">${msgs.map(m=>`<li>${esc(m.body)}<small>${new Date(m.created_at).toLocaleDateString('pt-BR')} · ${m.read_at?'lido ✓':'ainda não lido'}</small></li>`).join('')}</ul>`:'<p class="muted">Nenhum recado enviado.</p>'}

}

/* ---------- note sequence (single notes, scales, songs) ---------- */
function viewSeq(el,l,i,opts){
  const base=baseNote(l),notes=l.steps.map(s=>base+s),tol=K()?45:30;
  const hold=l.hold?M(l.hold):(K()?.6:.8);
  const single=notes.length===1;
  el.innerHTML=`<div class="panel">${tipBox(l)}
    ${single?'':`<div class="seqdots" id="dots">${notes.map((m,k)=>`<span>${l.lyrics?(l.lyrics[k]||'~').replace(/-$/,''):(l.labels?l.labels[k]:nm(m))}</span>`).join('')}</div>`}
    <div class="target"><span class="note" id="tn"></span><small id="hz"></small></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="play">▶ ${single?'Ouvir a nota':'Ouvir a melodia'}</button><button class="btn" id="mic">🎤 Cantar</button></div>
    <canvas id="cv" aria-label="Gráfico da sua voz em relação à nota alvo"></canvas>
    <div><div class="meter"><i id="needle"></i></div><div class="meterlab"><span>Baixo</span><span>Na nota</span><span>Alto</span></div></div>
    <p class="hint" id="hint">${single?'Escute a nota e toque em Cantar':'Escute a melodia e toque em Cantar'}</p>
    <div class="progress" aria-label="Tempo segurando a nota"><b id="pg"></b></div>
    ${l.showHold?'<p class="holdinfo" id="holdinfo">Afinado sem parar: 0,0s · Recorde: –</p>':''}
    <p class="muted" style="text-align:center;font-size:.9rem" id="you">Sua voz: –</p>
    <div id="scorebox"></div>
    ${l.credit?`<p class="credit">${l.credit}</p>`:''}
    ${demoBox('Arraste para simular a voz e ver como o app reage.')}
    <div class="row" style="justify-content:center" id="after"></div></div>`;
  const cv=$('#cv'),g=cv.getContext('2d'),needle=$('#needle'),hint=$('#hint'),pg=$('#pg'),you=$('#you'),dots=[...el.querySelectorAll('#dots span')];
  let raf=null,trail=[],held=0,last=performance.now(),won=false,demo=false,listening=false,smooth=null,step=0,needGap=false,gapT=0,muteUntil=0,stepT=0,moodT=0,voiced=0,inT=0,absSum=0,run=0,outT=0,bestRun=store.get('hold.'+l.id,0);
  const fmt=x=>x.toFixed(1).replace('.',',');
  function holdInfo(){const h=$('#holdinfo');if(h)h.textContent=`Afinado sem parar: ${fmt(run)}s · Recorde: ${bestRun?fmt(bestRun)+'s':'–'}`;}
  holdInfo();
  function react(kind){ if(!K()||won)return; const t=performance.now(); if(t-moodT<900)return; moodT=t;
    if(kind==='ok')guide(step>0&&!single?'Isso! Segura... ':'Isso! Você está na nota, segura!','happy');
    else if(kind==='up')guide('Sobe um pouquinho a voz, mais fininha!','think');
    else if(kind==='down')guide('Desce um pouquinho a voz, mais grossinha!','think');
    else if(kind==='help')guide('Tudo bem errar, todo cantor erra! Pare, toque em Ouvir e tente de novo. Você consegue!','idle');
    else if(kind==='next')guide(l.labels?`Agora a vogal ${l.labels[step]}!`:(l.lyrics&&l.lyrics[step]?`Agora: "${l.lyrics[step].replace(/[,.;-]/g,'')}"!`:`Agora a nota ${nm(notes[step])}!`),'happy'); }
  const H={up:K()?'Sobe um pouquinho! ⬆':'Um pouco abaixo: suba ⬆',down:K()?'Desce um pouquinho! ⬇':'Um pouco acima: desça ⬇',
    ok:K()?'Isso! Segura assim!':'Afinado. Sustente!',silent:K()?'Cante "lá" quando quiser':'Cante quando estiver pronto',gap:K()?'Respira... e a próxima!':'Pausa curta... próxima nota'};
  function show(){const m=notes[step];$('#tn').textContent=l.lyrics?`${(l.lyrics[step]||'~').replace(/[,.;-]/g,'')} · ${nm(m)}`:(l.labels?`${l.labels[step]} · ${nm(m)}`:nm(m));$('#hz').textContent=Math.round(midiToHz(m))+' Hz';
    dots.forEach((d,k)=>d.className=k<step?'ok':(k===step?'cur':''));}
  show();
  $('#play').onclick=()=>{const dur=single?1.4:.55;
    if(single){playTone(midiToHz(notes[0]),dur);muteUntil=performance.now()+dur*1000+150;return;}
    notes.forEach((m,k)=>playTone(midiToHz(m),dur-.05,null,k*dur));muteUntil=performance.now()+notes.length*dur*1000+150;};
  $('#mic').onclick=async()=>{ctx();
    if(listening){listening=false;stopMic();$('#mic').textContent='🎤 Cantar';hint.textContent=H.silent;return;}
    if(!await startMic()){demo=true;$('#demo').hidden=false;}
    listening=true;$('#mic').textContent='■ Parar';hint.textContent=H.silent;if(!raf)loop();};
  function draw(cents){
    const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const y=c=>h/2-c/200*(h/2-14);
    g.fillStyle=css('--band');g.fillRect(0,y(tol),w,y(-tol)-y(tol));
    g.strokeStyle=css('--line');g.lineWidth=1;[-100,100].forEach(c=>{g.beginPath();g.moveTo(0,y(c));g.lineTo(w,y(c));g.stroke();});
    g.fillStyle=css('--muted');g.font='12px Nunito,sans-serif';g.fillText('+100 cents',8,y(100)-4);g.fillText('−100',8,y(-100)+14);
    const sx=w-28,sy=y(0);g.fillStyle=css('--sun');g.beginPath();
    for(let k=0;k<10;k++){const r=k%2?6:14,a=-Math.PI/2+k*Math.PI/5;g.lineTo(sx+r*Math.cos(a),sy+r*Math.sin(a));}g.closePath();g.fill();
    g.strokeStyle=css('--accent');g.lineWidth=3;g.lineJoin='round';g.beginPath();let pen=false;const st=(w-60)/160;
    trail.forEach((c,k)=>{if(c==null){pen=false;return;}const X=k*st,Y=y(Math.max(-200,Math.min(200,c)));pen?g.lineTo(X,Y):g.moveTo(X,Y);pen=true;});g.stroke();
    if(cents!=null){const X=Math.min(trail.length,160)*st,Y=y(Math.max(-200,Math.min(200,cents)));
      g.fillStyle=Math.abs(cents)<=tol?css('--ok'):css('--accent');
      if(K()){g.beginPath();g.ellipse(X,Y,13,16,0,0,7);g.fill();g.strokeStyle=css('--muted');g.lineWidth=1.5;g.beginPath();g.moveTo(X,Y+16);g.quadraticCurveTo(X-6,Y+26,X,Y+34);g.stroke();}
      else{g.beginPath();g.arc(X,Y,7,0,7);g.fill();}}
  }
  function loop(){
    raf=requestAnimationFrame(loop);const now=performance.now(),dt=(now-last)/1000;last=now;
    const target=notes[step];let f=null;
    if(listening&&now>muteUntil){
      if(demo){f=midiToHz(target+(+$('#sim').value)/100);if(needGap&&gapT<.3){f=null;}}
      else if(mic){mic.analyser.getFloatTimeDomainData(mic.buf);f=detectPitch(mic.buf,actx.sampleRate);}
    }
    let cents=null;
    if(f){let c=(hzToMidi(f)-target)*100;while(c>600)c-=1200;while(c<-600)c+=1200;
      smooth=smooth==null?c:smooth*.7+c*.3;cents=smooth;
      you.textContent=`Sua voz: ${nm(Math.round(hzToMidi(f)))} · ${Math.round(f)} Hz · ${cents>0?'+':''}${Math.round(cents)} cents`;}
    else{smooth=null;if(listening)you.textContent='Sua voz: –';}
    trail.push(cents);if(trail.length>160)trail.shift();
    needle.style.left=(cents==null?50:50+Math.max(-100,Math.min(100,cents))/2)+'%';
    if(!won&&listening){
      if(needGap){if(cents==null){gapT+=dt;if(gapT>=.25)needGap=false;}hint.textContent=H.gap;pg.style.width='0%';draw(cents);return;}
      stepT+=dt;
      if(cents!=null){voiced+=dt;absSum+=Math.min(100,Math.abs(cents))*dt;if(Math.abs(cents)<=tol)inT+=dt;}
      if(cents!=null&&Math.abs(cents)<=tol){run+=dt;outT=0;}else{outT+=dt;if(outT>.25)run=0;}
      if(run>bestRun){bestRun=run;store.set('hold.'+l.id,bestRun);}
      holdInfo();
      if(cents==null){hint.textContent=H.silent;held=Math.max(0,held-dt*.5);}
      else if(Math.abs(cents)<=tol){hint.textContent=H.ok;held+=dt;react('ok');}
      else{hint.textContent=cents<0?H.up:H.down;held=Math.max(0,held-dt*.3);react(stepT>9?'help':(cents<0?'up':'down'));}
      pg.style.width=Math.min(100,held/hold*100)+'%';
      if(held>=hold){held=0;step++;
        if(step>=notes.length){won=true;step=notes.length-1;dots.forEach(d=>d.className='ok');if(!opts)markDone(l.id);
          const sc=voiced>0?Math.round(100*(.6*inT/voiced+.4*Math.max(0,1-absSum/voiced/100))):0;$('#scorebox').innerHTML=scoreHTML(sc,l.id);if(!opts)saveScore(l.id,sc);
          hint.innerHTML=`<span class="win"><span class="big">★</span>${single?(K()?'Você acertou a nota!':'Nota sustentada com afinação!'):(K()?'Você cantou tudinho!':'Sequência completa e afinada!')}</span>`;
          if(opts){stopMic();opts.onWin(sc);}else{$('#after').innerHTML=nextBtn(i);wireNext(i);celebrate(i,sc);}}
        else{show();trail=[];stepT=0;moodT=0;react('next');if(l.gap||(l.gapRepeats&&notes[step]===notes[step-1])){needGap=true;gapT=0;}}}
    }
    draw(cents);
  }
  draw(null);
  cleanup=()=>{cancelAnimationFrame(raf);raf=null;stopMic();};
}

/* ---------- ear training quiz ---------- */
const INTS=[[0,'Mesma nota','Igual'],[2,'Passo (2ª)','Passinho'],[4,'Terça (3ª)','Pulo médio'],[7,'Quinta (5ª)','Pulão'],[12,'Oitava (8ª)','Pulo gigante']];
function viewEar(el,l,i,opts){
  const n=l.n||8,mode=l.mode,b=baseNote(l),pass=(opts&&opts.pass)||75;
  const qs=[];for(let k=0;k<n;k++){
    if(mode==='hl'){const a=b+Math.floor(Math.random()*8);const pool=K()?[-5,-4,-3,3,4,5,0]:[-4,-3,-2,-1,1,2,3,4,0,0];const d=pool[Math.floor(Math.random()*pool.length)];qs.push({a,b2:a+d,ans:d>0?0:(d<0?2:1)});}
    else{const a=b+Math.floor(Math.random()*5);const it=Math.floor(Math.random()*INTS.length);qs.push({a,b2:a+INTS[it][0],ans:it});}}
  const labels=mode==='hl'?(K()?['Mais fininho ⬆','Igual','Mais grossinho ⬇']:['Mais aguda ⬆','Igual','Mais grave ⬇']):INTS.map(x=>K()?x[2]:x[1]);
  let k=0,right=0,answered=false;
  el.innerHTML=`<div class="panel">${opts?'':tipBox(l)}
    <p class="qcount" id="qc"></p>
    <div class="row" style="justify-content:center"><button class="btn" id="play">▶ Ouvir</button></div>
    <p class="hint" id="hint">${mode==='hl'?'A segunda nota é...':'Qual foi a distância?'}</p>
    <div class="choices" id="ch">${labels.map((t,j)=>`<button data-j="${j}">${t}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="nextq" hidden>Próxima →</button></div>
    <div id="scorebox"></div><div class="row" style="justify-content:center" id="after"></div></div>`;
  const play=()=>{const q=qs[k];playTone(midiToHz(q.a),.8);playTone(midiToHz(q.b2),.8,null,1.0);};
  function show(){answered=false;$('#qc').textContent=`Pergunta ${k+1} de ${n}`;$('#nextq').hidden=true;
    el.querySelectorAll('#ch button').forEach(bt=>{bt.className='';bt.disabled=false;});$('#hint').textContent=mode==='hl'?'A segunda nota é...':'Qual foi a distância?';}
  show();
  $('#play').onclick=()=>{ctx();play();};
  el.querySelectorAll('#ch button').forEach(bt=>bt.onclick=()=>{if(answered)return;answered=true;const j=+bt.dataset.j,q=qs[k];
    el.querySelectorAll('#ch button').forEach(x=>x.disabled=true);
    if(j===q.ans){right++;bt.className='right';$('#hint').textContent=K()?'Acertou! 🎉':'Correto!';if(K())guide(['Muito bem!','Isso aí!','Ouvido de ouro!'][k%3],'happy');}
    else{bt.className='wrong';el.querySelector(`#ch button[data-j="${q.ans}"]`).className='right';$('#hint').textContent=`A resposta era: ${labels[q.ans]}. Ouça de novo.`;if(K())guide('Quase! Toque em Ouvir de novo para comparar.','think');}
    $('#nextq').hidden=false;$('#nextq').textContent=k+1<n?'Próxima →':'Ver resultado';});
  $('#nextq').onclick=()=>{k++;if(k<n){show();ctx();play();return;}
    const sc=Math.round(right/n*100);$('#ch').hidden=true;$('#play').hidden=true;$('#nextq').hidden=true;$('#qc').textContent=`${right} de ${n} certas`;
    if(opts){opts.onWin(sc);return;}
    $('#scorebox').innerHTML=scoreHTML(sc,l.id).replace('Nota de afinação','Nota de percepção');saveScore(l.id,sc);
    if(sc>=pass){markDone(l.id);$('#hint').innerHTML=`<span class="win"><span class="big">★</span>${K()?'Que ouvido!':'Percepção aprovada!'}</span>`;$('#after').innerHTML=nextBtn(i);wireNext(i);celebrate(i,sc);}
    else{$('#hint').textContent=`Para ganhar a estrela, acerte ${Math.ceil(pass/100*n)} de ${n}. Vamos de novo?`;$('#after').innerHTML='<button class="btn" id="again">Tentar de novo</button>';$('#again').onclick=()=>go(l.id);}};
  cleanup=null;
}

/* ---------- level exam: parts in sequence ---------- */
function viewExam(el,l,i){
  const lv=levelOf(l),prev=L.filter(x=>levelOf(x)===lv&&x.id!==l.id),missing=prev.filter(x=>!state.done[x.id]);
  const scores=[];let part=0;
  el.innerHTML=`<div class="panel">${tipBox(l)}
    <div><span class="label">Antes da prova</span><ul class="reqs">${prev.map(x=>`<li>${state.done[x.id]?'✅':'⬜'} ${M(x.title)}</li>`).join('')}</ul></div>
    ${missing.length?`<p class="err">Complete as aulas que faltam (${missing.length}) para fazer a prova.</p>`:`<p class="muted">A prova tem ${l.parts.length} partes: ${l.parts.map(p=>p.title.replace(/^Parte \d: /,'')).join(', ')}. Você pode repetir quantas vezes quiser.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="start">Começar a prova</button></div>`}
  </div><div id="part"></div>`;
  if(missing.length&&!state.unlockAll)return;

  function runPart(){
    const p=l.parts[part],box=$('#part'),need=M(p.pass);
    box.innerHTML=`<p class="label" style="text-align:center">${p.title} · precisa de ${need} pontos</p><div id="pbody"></div>`;
    const done=sc=>{scores[part]=sc;
      const res=document.createElement('div');res.className='panel';
      if(sc>=need){part++;
        if(part<l.parts.length){res.innerHTML=`<p class="okmsg" style="text-align:center">✓ ${p.title}: ${sc} pontos</p><div class="row" style="justify-content:center"><button class="btn" id="np">Ir para a ${l.parts[part].title.split(':')[0]}</button></div>`;box.appendChild(res);$('#np').onclick=()=>{if(cleanup){cleanup();cleanup=null;}runPart();};if(K())guide('Passou nessa parte! Vamos para a próxima.','happy','force');}
        else{const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);markDone(l.id);saveScore(l.id,avg);
          const nextLv=LEVELS[lv];
          res.innerHTML=`<div class="win"><span class="big">🏆</span><h3>Aprovado no Nível ${lv}!</h3><p>Nota final: <b>${avg}</b>.</p>
            <p class="muted">${nextLv?(nextLv.soon?`O Nível ${nextLv.n} (${nextLv.title}) está chegando em breve. Continue treinando com o aquecimento do dia e os louvores.`:`O Nível ${nextLv.n} · ${nextLv.title} está liberado!`):''}</p></div>
            <div class="row" style="justify-content:center">${nextBtn(i)}</div>`;box.appendChild(res);wireNext(i);celebrate(i,avg);}
      } else {res.innerHTML=`<p class="err" style="text-align:center">${p.title}: ${sc} pontos. Precisa de ${need}. Treine mais um pouco e tente de novo!</p><div class="row" style="justify-content:center"><button class="btn" id="rp">Tentar esta parte de novo</button></div>`;
        box.appendChild(res);$('#rp').onclick=()=>{if(cleanup){cleanup();cleanup=null;}runPart();};if(K())guide('Quase! Respire fundo e tente de novo, você consegue!','idle','force');}
      res.scrollIntoView({behavior:'smooth',block:'center'});};
    const sub={...l,id:l.id+'_'+part,title:l.title,tip:l.tip,steps:p.steps,hold:p.hold,n:p.n,mode:p.mode};
    if(p.kind==='ear')viewEar($('#pbody'),sub,i,{onWin:done,pass:need});
    else if(p.kind==='seq')viewSeq($('#pbody'),sub,i,{onWin:done});
    else if(p.kind==='follow'){const ref=L[idx(p.ref)];viewFollow($('#pbody'),{...ref,id:l.id+'_'+part,tip:l.tip},i,{onWin:done});}

  $('#sim').min=36;$('#sim').max=84;$('#sim').value=55;

    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    const lo=36,hi=84,whites=[];for(let m=lo;m<=hi;m++)if(![1,3,6,8,10].includes(m%12))whites.push(m);
    const kw=w/whites.length,inR=m=>res.low!=null&&res.high!=null?(m>=res.low&&m<=res.high):(res.low!=null&&m>=res.low&&cur!=null&&m<=Math.max(res.low,cur));
    whites.forEach((m,j)=>{g.fillStyle=inR(m)?css('--band'):css('--surface');g.fillRect(j*kw,0,kw-1,h);
      if(m%12===0){g.fillStyle=css('--muted');g.font='10px Nunito,sans-serif';g.fillText('Dó'+(m/12-1),j*kw+2,h-6);}});
    g.strokeStyle=css('--line');g.strokeRect(0,0,w,h);
    for(let m=lo;m<=hi;m++)if([1,3,6,8,10].includes(m%12)){const j=whites.indexOf(m-1);g.fillStyle=css('--ink');g.globalAlpha=.75;g.fillRect((j+1)*kw-kw*.3,0,kw*.6,h*.58);g.globalAlpha=1;}
    const xOf=m=>{let j=0;for(;j<whites.length&&whites[j]<Math.round(m);j++);return j*kw+kw/2;};

    $('#go').disabled=false;$('#go').textContent='Ir para a trilha';$('#go').onclick=()=>go('home');

  }
  const vts=[...el.querySelectorAll('#vts span')];
  function runStep(){
    const s=steps[k];mode='rec';$('#st').textContent=`${k+1}. ${s.t}`;$('#sd').textContent=s.d;$('#go').disabled=true;$('#go').textContent='Ouvindo...';
    vts.forEach((v,j)=>v.className=j<k?'ok':(j===k?'on':''));
    if(K())guide(s.d,'idle');
    const vals=[],win=[];let t0=performance.now(),last=t0,lowS=null,highS=null;$('#tm').hidden=false;
    const tick=()=>{raf=requestAnimationFrame(tick);const now=performance.now(),el2=(now-t0)/1000;
      let f=null;if(demo)f=midiToHz(+$('#sim').value);else if(mic){mic.analyser.getFloatTimeDomainData(mic.buf);f=detectPitch(mic.buf,actx.sampleRate);}
      if(f){const m=hzToMidi(f);vals.push(m);win.push({t:now,m});cur=m;$('#live').textContent=nmo(m);}else{cur=null;}
      while(win.length&&now-win[0].t>300)win.shift();
      if(win.length>8){const ms=win.map(x=>x.m),mn=Math.min(...ms),mx=Math.max(...ms);
        if(mx-mn<.6){const avg=ms.reduce((a,b)=>a+b,0)/ms.length;if(lowS==null||avg<lowS)lowS=avg;if(highS==null||avg>highS)highS=avg;}}
      if(s.k==='low'&&lowS!=null)res.low=lowS;if(s.k==='high'&&highS!=null)res.high=highS;
      $('#tm').textContent=Math.max(0,Math.ceil(s.dur-el2))+'s';drawKeys();
      if(el2>=s.dur){cancelAnimationFrame(raf);raf=null;cur=null;
        if(vals.length<15){$('#sd').textContent='Não consegui ouvir direito. Cante um pouco mais alto ou chegue perto do microfone e tente de novo.';$('#go').disabled=false;$('#go').textContent='Tentar de novo';$('#go').onclick=runStep;return;}
        if(s.k==='comf'){vals.sort((a,b)=>a-b);res.comf=vals[Math.floor(vals.length/2)];}
        if(s.k==='low'&&res.low==null)res.low=Math.min(...vals);
        if(s.k==='high'&&res.high==null)res.high=Math.max(...vals);
        if(s.k==='low')res.low=Math.min(res.low,res.comf);if(s.k==='high')res.high=Math.max(res.high,res.comf);
        $('#tm').hidden=true;drawKeys();k++;
        if(k>=steps.length){stopMic();finish();return;}
        $('#go').disabled=false;$('#go').textContent='Próxima parte';$('#go').onclick=runStep;$('#st').textContent='Muito bem!';$('#sd').textContent='Quando estiver pronto, toque em Próxima parte.';
        if(K())guide('Muito bem! Agora a próxima parte.','happy');
      }};
    tick();
  }
  $('#go').onclick=async()=>{ctx();if(!await startMic()){demo=true;$('#demo').hidden=false;}runStep();};
  cleanup=()=>{cancelAnimationFrame(raf);raf=null;stopMic();};
}

/* ---------- follow the melody (in time, with score) ---------- */
function viewFollow(el,l,i,opts){
  const base=baseNote(l),beat=K()?.6:.5,tol=K()?50:35,pass=K()?50:60;
  let t=0;const ev=l.steps.map((s,k)=>{const d=(l.beats?l.beats[k]:1)*beat;const e={m:base+s,t0:t,t1:t+d*.9,hit:0,tot:0};t+=d;return e;});
  const total=t,ms=ev.map(e=>e.m),minM=Math.min(...ms)-2,maxM=Math.max(...ms)+2;
  el.innerHTML=`<div class="panel">${tipBox(l)}
    <canvas class="lane" id="cv" aria-label="Notas da melodia passando e a linha da sua voz"></canvas>
    ${l.lyrics?`<p class="lyric" id="lyr">${l.lyrics.map((x,k)=>x?`<span data-k="${k}">${x.replace(/-$/,'')}</span>${x.endsWith('-')?'':' '}`:'').join('')}</p>`:''}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="play">▶ Ouvir</button><button class="btn" id="mic">🎤 Cantar junto</button></div>
    <p class="hint" id="hint">${K()?'Toque em Ouvir para conhecer a melodia':'Ouça a melodia uma vez e depois cante junto'}</p>
    <div id="scorebox"></div>
    <p class="muted" style="text-align:center;font-size:.9rem">Para ganhar a estrela: nota ${pass} ou mais</p>
    ${l.credit?`<p class="credit">${l.credit}</p>`:''}
    ${demoBox('Arraste para simular a voz enquanto as notas passam.')}
    <div class="row" style="justify-content:center" id="after"></div></div>`;
  const cv=$('#cv'),g=cv.getContext('2d'),hint=$('#hint'),lyr=[...el.querySelectorAll('#lyr span')];
  let mode='idle',t0=0,raf=null,demo=false,trail=[],smooth=null,timers=[];
  const now=()=>(performance.now()-t0)/1000;
  function draw(time,fit){
    const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    if(fit)time=0;const px=fit?34:w*.25,pps=fit?(w-44)/total:w/4.2,X=tt=>px+(tt-time)*pps,rowH=(h-20)/(maxM-minM),Y=m=>h-10-(m-minM)*rowH;
    g.font='11px Nunito,sans-serif';
    for(let m=Math.ceil(minM);m<=maxM;m++){if([1,3,6,8,10].includes(((m%12)+12)%12))continue;
      g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();g.moveTo(0,Y(m));g.lineTo(w,Y(m));g.stroke();
      g.fillStyle=css('--muted');g.fillText(nm(m),4,Y(m)-3);}
    ev.forEach(e=>{const x0=X(e.t0),x1=X(e.t1);if(x1<0||x0>w)return;
      const r=e.tot>0?e.hit/e.tot:null;
      g.fillStyle=r==null?css('--accent'):(r>=.5?css('--ok'):css('--coral'));g.globalAlpha=r==null?.85:1;
      const hh=Math.max(10,rowH*.8),yy=Y(e.m)-hh/2,rr=hh/2;
      g.beginPath();g.moveTo(x0+rr,yy);g.lineTo(x1-rr,yy);g.arc(x1-rr,yy+rr,rr,-Math.PI/2,Math.PI/2);g.lineTo(x0+rr,yy+hh);g.arc(x0+rr,yy+rr,rr,Math.PI/2,Math.PI*1.5);g.fill();g.globalAlpha=1;
      const lab=l.lyrics?(l.lyrics[ev.indexOf(e)]||'').replace(/[,.;-]/g,''):nm(e.m);
      if(lab&&(x1-x0>22||fit)){g.fillStyle=l.lyrics?css('--ink'):css('--accent-ink');g.font='bold 11px Nunito,sans-serif';
        if(l.lyrics)g.fillText(lab,x0,yy+hh+12);else if(x1-x0>26)g.fillText(lab,x0+8,yy+hh/2+4);g.font='11px Nunito,sans-serif';}});
    if(lyr){const ci=ev.findIndex(e=>time>=e.t0&&time<e.t0+(e.t1-e.t0)/.9);lyr.forEach(sp=>{const k=+sp.dataset.k;sp.className=(!fit&&k===ci)?'now':((!fit&&time>ev[k].t0)?'past':'');});}
    if(!fit){g.strokeStyle=css('--ink');g.lineWidth=2;g.beginPath();g.moveTo(px,0);g.lineTo(px,h);g.stroke();}
    g.strokeStyle=css('--sun');g.lineWidth=4;g.lineJoin='round';g.beginPath();let pen=false;
    trail.forEach(p=>{if(p.m==null){pen=false;return;}const x=X(p.t);if(x<0)return;pen?g.lineTo(x,Y(p.m)):g.moveTo(x,Y(p.m));pen=true;});g.stroke();
    const lp=trail[trail.length-1];if(lp&&lp.m!=null&&mode==='sing'){g.fillStyle=css('--sun');g.beginPath();g.arc(px,Y(lp.m),7,0,7);g.fill();}
  }
  function cur(time){return ev.find(e=>time>=e.t0&&time<=e.t1)||null}
  function stopAll(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);raf=null;}
  $('#play').onclick=()=>{if(mode==='sing')return;stopAll();ctx();trail=[];ev.forEach(e=>{e.hit=0;e.tot=0});
    ev.forEach(e=>playTone(midiToHz(e.m),e.t1-e.t0,null,e.t0+.3));t0=performance.now()+300;mode='preview';hint.textContent=K()?'Escute e veja as notas passando...':'Ouça e acompanhe as notas...';
    const step=()=>{raf=requestAnimationFrame(step);draw(now());if(now()>total+.5){stopAll();mode='idle';hint.textContent=K()?'Agora é sua vez! Toque em Cantar junto':'Agora cante junto';draw(0,true);}};step();};
  $('#mic').onclick=async()=>{ctx();
    if(mode==='sing'){finish(true);return;}
    stopAll();if(!await startMic()){demo=true;$('#demo').hidden=false;}
    trail=[];ev.forEach(e=>{e.hit=0;e.tot=0});$('#scorebox').innerHTML='';mode='count';$('#mic').textContent='■ Parar';
    const lead=beat*1.6;[3,2,1].forEach((n,k)=>timers.push(setTimeout(()=>{hint.textContent=n+'...';playTone(n===1?880:660,.08)},k*lead/3*1000)));
    timers.push(setTimeout(()=>{hint.textContent=K()?'Canta!':'Cante!';},lead*1000));
    t0=performance.now()+lead*1000;let last=performance.now();
    const step=()=>{raf=requestAnimationFrame(step);const tn=now(),pn=performance.now(),dt=(pn-last)/1000;last=pn;
      if(tn<0){draw(tn);return;}mode='sing';
      const c=cur(tn);let f=null;
      if(demo){f=c?midiToHz(c.m+(+$('#sim').value)/100):null;}
      else if(mic){mic.analyser.getFloatTimeDomainData(mic.buf);f=detectPitch(mic.buf,actx.sampleRate);}
      let m=null;
      if(f){let raw=hzToMidi(f);const ref=c?c.m:(ev.find(e=>e.t0>tn)||ev[ev.length-1]).m;while(raw-ref>6)raw-=12;while(raw-ref<-6)raw+=12;smooth=smooth==null?raw:smooth*.6+raw*.4;m=smooth;}else smooth=null;
      trail.push({t:tn,m});if(trail.length>600)trail.shift();
      if(c&&tn>c.t0+.12){c.tot+=dt;if(m!=null&&Math.abs(m-c.m)*100<=tol)c.hit+=dt;}
      if(K()&&c&&tn>c.t0+.2){const ok=m!=null&&Math.abs(m-c.m)*100<=tol;hint.textContent=m==null?'Canta junto!':(ok?'Isso!':(m<c.m?'Sobe! ⬆':'Desce! ⬇'));}
      draw(tn);if(tn>total+.4)finish(false);};
    step();};
  function finish(stopped){
    stopAll();stopMic();$('#mic').textContent='🎤 Cantar junto';mode='done';draw(0,true);
    const tot=ev.reduce((a,e)=>a+e.tot,0),hit=ev.reduce((a,e)=>a+e.hit,0);
    if(stopped&&tot<total*.5){hint.textContent=K()?'Parou! Quando quiser, tente de novo.':'Interrompido. Tente de novo quando quiser.';mode='idle';return;}
    const sc=tot>0?Math.round(100*hit/tot):0;$('#scorebox').innerHTML=scoreHTML(sc,l.id);
    if(opts){opts.onWin(sc);return;}saveScore(l.id,sc);
    if(sc>=pass){markDone(l.id);hint.innerHTML=`<span class="win"><span class="big">★</span>${K()?'Você cantou no ritmo!':'Melodia completa no tempo!'}</span>`;$('#after').innerHTML=nextBtn(i);wireNext(i);celebrate(i,sc);}
    else{hint.textContent=K()?'Quase! Ouça de novo e tente mais uma vez.':'Ainda não. Ouça de novo as notas vermelhas e repita.';
      if(K())guide(`Sua nota foi ${sc}. Quase lá! As notas vermelhas são as que escaparam. Vamos tentar de novo?`,'idle','force');}
  }
  draw(0,true);
  cleanup=()=>{stopAll();stopMic();};
}

render();
initCloud();
})();
</script>
