<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f9e92"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Voz Livre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one-column app shell (max 560px), card-light; header with mode switch; each lesson is its own screen */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1d2b4f; --muted:#5d6b8a; --line:#dde3ef;
  --accent:#1f9e92; --accent-ink:#ffffff; --sun:#ffc23c; --coral:#f2604f; --ok:#22a061; --band:rgba(31,158,146,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a2e; --surface:#1b2540; --ink:#eef2fb; --muted:#a3afc9; --line:#2c3858;
  --accent:#3cc5b7; --accent-ink:#0e1a2c; --sun:#ffcf5c; --coral:#ff7d6e; --ok:#3fc985; --band:rgba(60,197,183,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a2e; --surface:#1b2540; --ink:#eef2fb; --muted:#a3afc9; --line:#2c3858;
  --accent:#3cc5b7; --accent-ink:#0e1a2c; --sun:#ffcf5c; --coral:#ff7d6e; --ok:#3fc985; --band:rgba(60,197,183,.18); color-scheme:dark}
body.kid{--accent:#f2604f; --band:rgba(242,96,79,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.kid{--accent:#ff7d6e;--band:rgba(255,125,110,.18)}}
:root[data-theme="dark"] body.kid{--accent:#ff7d6e;--band:rgba(255,125,110,.18)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,.lesson:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:24px;height:24px;fill:var(--accent-ink)}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:800}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:center}
.hero .mascot{flex:none;width:76px;height:76px}
.hero div{min-width:0;display:flex;flex-direction:column;gap:6px}
.stars{font-weight:700;color:var(--muted);font-size:.95rem}
.stars span{color:var(--sun)}

.voicepick{display:flex;flex-direction:column;gap:8px}
.voicepick .seg{align-self:flex-start;flex-wrap:wrap}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.lesson:hover{border-color:var(--accent)}
.lesson .num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--band);color:var(--accent)}
.lesson .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.lesson .txt small{color:var(--muted)}
.lesson .done{flex:none;font-size:1.3rem;color:var(--sun)}

.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--band);border-radius:14px;padding:12px 14px;font-size:.95rem}
.tip b{color:var(--accent)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* breathing */
.breath{display:grid;place-items:center;height:260px;position:relative}
.ball{width:110px;height:110px;border-radius:50%;background:var(--accent);opacity:.9;transform:scale(.7);transition:transform 4s ease-in-out}
.breath .say{position:absolute;inset:auto 0 0 0;text-align:center;font-family:var(--display);font-size:1.5rem;font-weight:800}
.breath .count{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--accent-ink)}

/* warmup */
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line)}
.steps li.on{border-color:var(--accent);background:var(--band)}
.steps li.ok .n{background:var(--ok);color:#fff}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line);color:var(--ink)}
.steps .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

/* pitch */
.target{display:flex;align-items:baseline;justify-content:center;gap:10px}
.target .note{font-family:var(--display);font-size:3.2rem;font-weight:800;color:var(--accent)}
.target small{color:var(--muted);font-weight:700}
canvas{width:100%;height:220px;display:block;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.meter{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--sun) 35%,var(--ok) 45%,var(--ok) 55%,var(--sun) 65%,var(--coral))}
.meter i{position:absolute;top:-6px;width:6px;height:28px;border-radius:4px;background:var(--ink);left:50%;transform:translateX(-50%);transition:left .12s linear}
.meterlab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700}
.hint{font-family:var(--display);font-size:1.4rem;font-weight:800;text-align:center;min-height:2.2em}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.notes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.notes button{border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 12px;font-weight:800}
.notes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.demo{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.demo input{width:100%}
.win{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.win .big{font-size:3rem;line-height:1;color:var(--sun)}
footer{font-size:.85rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.ball,.meter i,.progress b{transition:none}}
</style>

<div class="app" id="app"></div>

<script>
(function(){
const $ = (s,el=document)=>el.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem('vozlivre.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('vozlivre.'+k,JSON.stringify(v))}catch(e){}}
};
const state = {
  mode: store.get('mode','kid'),        // kid | adult
  voice: store.get('voice','high'),     // high | low (adult only)
  done: store.get('done',{}),           // lessonId -> true
  view: 'home'
};

/* ---------- copy for both modes ---------- */
const T = {
  kid:{
    hello:'Oi, cantor! Vamos brincar com a voz?',
    sub:'Cada lição ganha uma estrela. Você consegue!',
    lessons:[
      ['breath','Respiração do balão','Encha a barriga como um balão'],
      ['warm','Aquecimento divertido','Moto, abelhinha e sirene'],
      ['pitch','Acerte a nota','Faça o balão voar até a estrela']
    ],
    breathTip:'Coloque a mão na barriga. Quando o ar entra, a barriga cresce igual a um balão. Os ombros ficam quietinhos!',
    breathSay:['Cheira a flor','Segura...','Sssss, esvazia o balão'],
    warm:[
      ['Espreguiçar','Estique os braços, boceje bem grande e solte os ombros.'],
      ['Motinha','Feche os lábios soltinhos e faça "brrrrr" como uma moto.'],
      ['Abelhinha','Boca fechada, faça "mmmmm". Sente a cosquinha no nariz?'],
      ['Sirene','Faça "uuuuu" começando grossinho e subindo bem fininho, depois desça.']
    ],
    warmTip:'Aquecer a voz é como alongar antes de correr. Nunca force: se doer ou coçar, pare e beba água.',
    pitchTip:'Primeiro escute a nota. Depois cante "uuu" ou "lá" bem tranquilo. Se o balão está embaixo da estrela, suba a voz. Se está em cima, desça.',
    hintUp:'Sobe um pouquinho! ⬆',hintDown:'Desce um pouquinho! ⬇',hintOk:'Isso! Segura assim!',hintSilent:'Cante "uuu" quando quiser',
    win:'Você acertou a nota! Ganhou uma estrela!'
  },
  adult:{
    hello:'Bem-vindo à sua aula de canto',
    sub:'Três exercícios curtos por dia já fazem diferença. Comece pela respiração.',
    lessons:[
      ['breath','Respiração diafragmática','Controle do ar: a base de tudo'],
      ['warm','Aquecimento vocal','Vibração de lábios, humming e sirene'],
      ['pitch','Afinação: sustentar a nota','Feedback em tempo real da sua voz']
    ],
    breathTip:'Inspire pelo nariz expandindo abdômen e costelas, sem subir os ombros. Na expiração, solte o ar em "sss" de forma constante: é esse controle que sustenta as notas longas.',
    breathSay:['Inspire pelo nariz','Suspenda o ar','Solte em "sss" contínuo'],
    warm:[
      ['Relaxamento','Gire os ombros, alongue o pescoço e boceje para abrir a garganta.'],
      ['Vibração de lábios','Lábios soltos, faça "brrr" sustentado. Reduz tensão e equilibra o ar.'],
      ['Humming','Boca fechada, "mmm" em uma nota confortável. Sinta vibrar na face (ressonância).'],
      ['Sirene','Em "uuu", deslize do grave ao agudo e volte, sem quebras e sem forçar.']
    ],
    warmTip:'Faça tudo em volume confortável. Aquecimento não é treino de força: o objetivo é preparar a musculatura sem cansar.',
    pitchTip:'Escute a referência, imagine a nota por um segundo e cante em "lá" ou "uuu". Afinação é ouvido + ajuste: use a linha do gráfico para perceber se você está acima ou abaixo.',
    hintUp:'Um pouco abaixo: suba ⬆',hintDown:'Um pouco acima: desça ⬇',hintOk:'Afinado. Sustente!',hintSilent:'Cante quando estiver pronto',
    win:'Nota sustentada com afinação. Excelente!'
  }
};

/* ---------- notes ---------- */
const NAMES=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const midiToHz=m=>440*Math.pow(2,(m-69)/12);
const hzToMidi=f=>69+12*Math.log2(f/440);
function noteSet(){
  if(state.mode==='kid') return [60,62,64,65,67];          // Dó4..Sol4
  return state.voice==='low' ? [48,50,52,53,55] : [57,59,60,62,64]; // Dó3..Sol3 | Lá3..Mi4
}

/* ---------- audio ---------- */
let actx=null;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function playTone(hz,dur=1.4,glideTo=null){
  const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type='triangle'; o.frequency.setValueAtTime(hz,t);
  if(glideTo){o.frequency.exponentialRampToValueAtTime(glideTo,t+dur/2);o.frequency.exponentialRampToValueAtTime(hz,t+dur);}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.05);g.gain.setValueAtTime(.25,t+dur-.2);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}

let mic=null; // {analyser, buf, stream}
async function startMic(){
  if(mic) return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ctx(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();
    an.fftSize=2048; src.connect(an);
    mic={analyser:an,buf:new Float32Array(an.fftSize),stream};
    return true;
  }catch(e){ return false; }
}
function stopMic(){ if(mic){mic.stream.getTracks().forEach(t=>t.stop());mic=null;} }

// Autocorrelation pitch detector (good for a single sung voice)
function detectPitch(buf,sr){
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length); if(rms<0.012) return null;
  let r1=0,r2=buf.length-1;const th=0.2;
  for(let i=0;i<buf.length/2;i++) if(Math.abs(buf[i])<th){r1=i;break;}
  for(let i=1;i<buf.length/2;i++) if(Math.abs(buf[buf.length-i])<th){r2=buf.length-i;break;}
  const b=buf.slice(r1,r2),n=b.length,c=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<n-i;j++) s+=b[j]*b[j+i];c[i]=s;}
  let d=0; while(d<n-1&&c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1; for(let i=d;i<n;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  if(maxp<=0||maxp>=n-1) return null;
  const x1=c[maxp-1],x2=c[maxp],x3=c[maxp+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  const T0=a?maxp-bb/(2*a):maxp, f=sr/T0;
  return (f>70&&f<1100)?f:null;
}

/* ---------- mascot (simple SVG bird) ---------- */
const mascot=()=>`<svg class="mascot" viewBox="0 0 80 80" aria-hidden="true">
  <circle cx="40" cy="42" r="30" fill="var(--sun)"/><circle cx="31" cy="36" r="4.5" fill="#1d2b4f"/><circle cx="49" cy="36" r="4.5" fill="#1d2b4f"/>
  <ellipse cx="40" cy="52" rx="8" ry="${state.mode==='kid'?7:5}" fill="var(--coral)"/>
  <path d="M60 22 q8 -4 10 -14 M60 22 l4 -8" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="70" cy="9" r="4" fill="var(--accent)"/></svg>`;

/* ---------- render ---------- */
let cleanup=null;
function go(view){ if(cleanup){cleanup();cleanup=null;} state.view=view; render(); window.scrollTo(0,0); }
function starCount(){return Object.keys(state.done).filter(k=>state.done[k]).length}
function markDone(id){state.done[id]=true;store.set('done',state.done)}

function render(){
  document.body.classList.toggle('kid',state.mode==='kid');
  const t=T[state.mode], app=$('#app');
  const head=`<header class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></div><b>Voz Livre</b></div>
    <div class="seg" role="group" aria-label="Modo">
      <button id="m-kid" aria-pressed="${state.mode==='kid'}">Criança</button>
      <button id="m-adult" aria-pressed="${state.mode==='adult'}">Adulto</button>
    </div></header>`;
  if(state.view==='home'){
    app.innerHTML=head+`
    <section class="hero">${mascot()}<div><h1>${t.hello}</h1><p class="muted">${t.sub}</p>
      <p class="stars"><span>★</span> ${starCount()} de 3 estrelas</p></div></section>
    ${state.mode==='adult'?`<section class="voicepick"><span class="label">Sua voz é mais</span>
      <div class="seg" role="group" aria-label="Tipo de voz">
        <button id="v-low" aria-pressed="${state.voice==='low'}">Grave (masculina)</button>
        <button id="v-high" aria-pressed="${state.voice==='high'}">Aguda (feminina)</button></div></section>`:''}
    <section class="lessons">${t.lessons.map((l,i)=>`
      <button class="lesson" data-go="${l[0]}"><span class="num">${i+1}</span>
      <span class="txt"><h3>${l[1]}</h3><small>${l[2]}</small></span>
      <span class="done" aria-label="${state.done[l[0]]?'concluída':''}">${state.done[l[0]]?'★':''}</span></button>`).join('')}
    </section>
    <footer>Protótipo · sons e microfone funcionam depois de tocar em um botão</footer>`;
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
    const vl=$('#v-low'),vh=$('#v-high');
    if(vl){vl.onclick=()=>{state.voice='low';store.set('voice','low');render()};vh.onclick=()=>{state.voice='high';store.set('voice','high');render()};}
  } else {
    const l=t.lessons.find(x=>x[0]===state.view);
    app.innerHTML=head+`<button class="back" id="back">← Voltar às lições</button><h2>${l[1]}</h2><div id="body"></div>`;
    $('#back').onclick=()=>go('home');
    ({breath:viewBreath,warm:viewWarm,pitch:viewPitch})[state.view]($('#body'),t);
  }
  $('#m-kid').onclick=()=>{state.mode='kid';store.set('mode','kid');go(state.view)};
  $('#m-adult').onclick=()=>{state.mode='adult';store.set('mode','adult');go(state.view)};
}

/* ---------- lesson 1: breathing ---------- */
function viewBreath(el,t){
  el.innerHTML=`<div class="panel">
    <div class="tip"><span>💡</span><p><b>Dica do professor:</b> ${t.breathTip}</p></div>
    <div class="breath"><div class="ball" id="ball"></div><div class="count" id="cnt"></div><div class="say" id="say">Pronto?</div></div>
    <p class="muted" style="text-align:center" id="cycle">4 ciclos · inspira 4s · segura 2s · solta 6s</p>
    <div class="row" style="justify-content:center"><button class="btn" id="go">Começar</button></div></div>`;
  const ball=$('#ball'),say=$('#say'),cnt=$('#cnt'),cyc=$('#cycle'),btn=$('#go');
  let timers=[],tick=null;
  const phases=[[4,1.35,0],[2,1.35,1],[6,.7,2]];
  function clear(){timers.forEach(clearTimeout);timers=[];clearInterval(tick);}
  function run(){
    clear(); btn.disabled=true; let at=0;
    for(let c=0;c<4;c++) phases.forEach(([s,scale,si])=>{
      timers.push(setTimeout(()=>{
        cyc.textContent=`Ciclo ${c+1} de 4`;
        ball.style.transitionDuration=s+'s'; ball.style.transform=`scale(${scale})`;
        say.textContent=t.breathSay[si]; let left=s; cnt.textContent=left;
        clearInterval(tick); tick=setInterval(()=>{left--;cnt.textContent=left>0?left:''},1000);
      },at*1000)); at+=s;
    });
    timers.push(setTimeout(()=>{clear();cnt.textContent='';say.textContent=state.mode==='kid'?'Muito bem! ★':'Concluído ★';
      ball.style.transform='scale(.7)';markDone('breath');btn.disabled=false;btn.textContent='Repetir';},at*1000));
  }
  btn.onclick=run; cleanup=clear;
}

/* ---------- lesson 2: warm-up ---------- */
function viewWarm(el,t){
  const SEC=20;
  el.innerHTML=`<div class="panel">
    <div class="tip"><span>💡</span><p><b>Dica do professor:</b> ${t.warmTip}</p></div>
    <ol class="steps">${t.warm.map((w,i)=>`<li data-i="${i}"><span class="n">${i+1}</span><span class="t"><h3>${w[0]}</h3><span class="muted">${w[1]}</span></span></li>`).join('')}</ol>
    <div class="timer" id="tm">${SEC}s</div>
    <div class="row" style="justify-content:center"><button class="btn" id="go">Começar</button><button class="btn ghost" id="ex">Ouvir a sirene</button></div></div>`;
  const items=[...el.querySelectorAll('.steps li')],tm=$('#tm'),btn=$('#go');
  let i=-1,left=0,iv=null;
  function next(){
    if(i>=0) items[i].classList.replace('on','ok');
    i++; if(i>=items.length){clearInterval(iv);tm.textContent=state.mode==='kid'?'Voz quentinha! ★':'Voz aquecida ★';markDone('warm');btn.disabled=false;btn.textContent='Repetir';return;}
    items[i].classList.add('on'); left=SEC; tm.textContent=left+'s';
  }
  btn.onclick=()=>{items.forEach(x=>x.className='');i=-1;btn.disabled=true;next();clearInterval(iv);iv=setInterval(()=>{left--;tm.textContent=left+'s';if(left<=0)next();},1000);};
  $('#ex').onclick=()=>{const lo=state.mode==='kid'?262:(state.voice==='low'?110:196);playTone(lo,3,lo*2.5)};
  cleanup=()=>clearInterval(iv);
}

/* ---------- lesson 3: pitch match ---------- */
function viewPitch(el,t){
  const notes=noteSet(); let target=notes[0];
  const tol=state.mode==='kid'?45:30, need=state.mode==='kid'?1.5:2.5;
  el.innerHTML=`<div class="panel">
    <div class="tip"><span>💡</span><p><b>Dica do professor:</b> ${t.pitchTip}</p></div>
    <div class="notes" id="notes">${notes.map(m=>`<button data-m="${m}" aria-pressed="${m===target}">${NAMES[m%12]}</button>`).join('')}</div>
    <div class="target"><span class="note" id="tn"></span><small id="hz"></small></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="play">▶ Ouvir a nota</button><button class="btn" id="mic">🎤 Cantar</button></div>
    <canvas id="cv" aria-label="Gráfico da sua voz em relação à nota alvo"></canvas>
    <div><div class="meter"><i id="needle"></i></div><div class="meterlab"><span>Baixo</span><span>Na nota</span><span>Alto</span></div></div>
    <p class="hint" id="hint">Escute a nota e toque em Cantar</p>
    <div class="progress" aria-label="Tempo segurando a nota"><b id="pg"></b></div>
    <p class="muted" style="text-align:center;font-size:.9rem" id="you">Sua voz: –</p>
    <div class="demo" id="demo" hidden><span class="label">Modo demonstração</span>
      <p class="muted" style="font-size:.9rem">O microfone não está disponível aqui. Arraste para simular a voz e ver como o app reage. Abra o arquivo no navegador do computador ou celular para usar sua voz de verdade.</p>
      <input type="range" id="sim" min="-150" max="150" value="-120" aria-label="Simular altura da voz"></div>
  </div>`;
  const cv=$('#cv'),g=cv.getContext('2d'),needle=$('#needle'),hint=$('#hint'),pg=$('#pg'),you=$('#you');
  let raf=null,trail=[],held=0,last=performance.now(),won=false,demo=false,listening=false,smooth=null;
  function setTarget(m){target=m;won=false;held=0;trail=[];
    $('#tn').textContent=NAMES[m%12]; $('#hz').textContent=Math.round(midiToHz(m))+' Hz';
    el.querySelectorAll('#notes button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===m));}
  setTarget(target);
  el.querySelectorAll('#notes button').forEach(b=>b.onclick=()=>{setTarget(+b.dataset.m);playTone(midiToHz(target))});
  $('#play').onclick=()=>playTone(midiToHz(target));
  $('#mic').onclick=async()=>{
    ctx();
    if(listening){listening=false;stopMic();$('#mic').textContent='🎤 Cantar';hint.textContent=t.hintSilent;return;}
    const ok=await startMic();
    if(!ok){demo=true;$('#demo').hidden=false;}
    listening=true;$('#mic').textContent='■ Parar';hint.textContent=t.hintSilent;
    if(!raf) loop();
  };
  function css(v){return getComputedStyle(document.body).getPropertyValue(v).trim()}
  function draw(cents){
    const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const y=c=>h/2-c/200*(h/2-14);
    // target band
    g.fillStyle=css('--band'); g.fillRect(0,y(tol),w,y(-tol)-y(tol));
    g.strokeStyle=css('--line'); g.lineWidth=1;
    [-100,100].forEach(c=>{g.beginPath();g.moveTo(0,y(c));g.lineTo(w,y(c));g.stroke();});
    g.fillStyle=css('--muted'); g.font='12px Nunito,sans-serif';
    g.fillText('+100 cents',8,y(100)-4); g.fillText('−100',8,y(-100)+14);
    // goal star at right
    const sx=w-28, sy=y(0); g.fillStyle=css('--sun'); g.beginPath();
    for(let k=0;k<10;k++){const r=k%2?6:14,a=-Math.PI/2+k*Math.PI/5;g.lineTo(sx+r*Math.cos(a),sy+r*Math.sin(a));}
    g.closePath(); g.fill();
    // trail
    g.strokeStyle=css('--accent'); g.lineWidth=3; g.lineJoin='round'; g.beginPath(); let pen=false;
    const step=(w-60)/160;
    trail.forEach((c,i)=>{if(c==null){pen=false;return;}const X=i*step,Y=y(Math.max(-200,Math.min(200,c)));pen?g.lineTo(X,Y):g.moveTo(X,Y);pen=true;});
    g.stroke();
    // current marker: balloon (kid) or dot (adult)
    if(cents!=null){
      const X=Math.min(trail.length,160)*step, Y=y(Math.max(-200,Math.min(200,cents)));
      g.fillStyle=Math.abs(cents)<=tol?css('--ok'):css('--accent');
      if(state.mode==='kid'){g.beginPath();g.ellipse(X,Y,13,16,0,0,7);g.fill();g.strokeStyle=css('--muted');g.lineWidth=1.5;g.beginPath();g.moveTo(X,Y+16);g.quadraticCurveTo(X-6,Y+26,X,Y+34);g.stroke();}
      else{g.beginPath();g.arc(X,Y,7,0,7);g.fill();}
    }
  }
  function loop(){
    raf=requestAnimationFrame(loop);
    const now=performance.now(),dt=(now-last)/1000; last=now;
    let f=null;
    if(listening){
      if(demo) f=midiToHz(target+(+$('#sim').value)/100);
      else if(mic){mic.analyser.getFloatTimeDomainData(mic.buf); f=detectPitch(mic.buf,actx.sampleRate);}
    }
    let cents=null;
    if(f){
      let c=(hzToMidi(f)-target)*100;
      // beginners often sing the right note in another octave: accept it
      while(c>600)c-=1200; while(c<-600)c+=1200;
      smooth=smooth==null?c:smooth*0.7+c*0.3; cents=smooth;
      const m=Math.round(hzToMidi(f)); you.textContent=`Sua voz: ${NAMES[((m%12)+12)%12]} · ${Math.round(f)} Hz · ${cents>0?'+':''}${Math.round(cents)} cents`;
    } else { smooth=null; if(listening) you.textContent='Sua voz: –'; }
    trail.push(cents); if(trail.length>160) trail.shift();
    needle.style.left=(cents==null?50:50+Math.max(-100,Math.min(100,cents))/2)+'%';
    if(!won && listening){
      if(cents==null){hint.textContent=t.hintSilent;held=Math.max(0,held-dt*.5);}
      else if(Math.abs(cents)<=tol){hint.textContent=t.hintOk;held+=dt;}
      else {hint.textContent=cents<0?t.hintUp:t.hintDown;held=Math.max(0,held-dt*.3);}
      pg.style.width=Math.min(100,held/need*100)+'%';
      if(held>=need){won=true;markDone('pitch');hint.innerHTML=`<span class="win"><span class="big">★</span>${t.win}</span>`;}
    }
    draw(cents);
  }
  draw(null);
  cleanup=()=>{cancelAnimationFrame(raf);raf=null;stopMic();};
}

render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script></body></html>
